<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h3>Textos</h3>
    <hr>
    <h1>Titulo h1</h1>
    <h2>Titulo h2</h2>
    <h3>Titulo h3</h3>
    <h4>Titulo h4</h4>
    <h5>Titulo h5</h5>
    <h6>Titulo h6</h6>
    <br>
    <p><u>testando</u> <strong>parágrafos</strong></p>
    <br>
    <em>A Itália não está na copa</em>
    <br>
    <mark>marcação aqui</mark>
    <br>
    <small>texto pequeno</small>
    <br>
    <span>2</span><sup>2</sup>
    <br>
    <span>10</span><sub>2</sub>
    <br>
    <blockquote>texto aleatório</blockquote>
    <br>
    <q>citação aleatória</q>
    <br>
    <code>codigo para teste</code>
    <br>
    <pre>padrao poema</pre>
    <br>
    <abbr title="">teste</abbr>
    <br>
    <address>Jacatirão</address>
    <time datetime="">30/06/2026</time>
    <br>
    <hr>
    <section>
        <h3>Imagens</h3>
        <img width="50%" height="50%" src="https://picsum.photos/200/300" alt="random image">
    </section>
</body>
</html>
